<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Kết quả ôn tập')}"></head><body><aside th:replace="~{fragments/layout :: sidebar}"></aside><div class="workspace"><header th:replace="~{fragments/layout :: topbar}"></header><main>
<h1 th:text="${'Kết quả ôn · ' + result.level.label}"></h1><article class="card"><h2 th:text="${result.score + '/100'}"></h2><p th:text="${result.score >= 80 ? 'Kết quả tốt. Tiếp tục luyện nghe/đọc và ứng dụng trong bài tập kỹ thuật.' : 'Xem câu sai theo từng kỹ năng bên dưới; quay lại phần từ vựng, ngữ pháp hoặc nghe/đọc để ôn.'}"></p><p>Đã lưu minh chứng và cập nhật lịch ôn sau 7 ngày. Trình độ không thay đổi.</p><a class="button" th:href="@{/language/{level}(level=${result.level})}">Quay lại khóa học </a><a href="/language/history">Lịch sử</a></article><article class="card"><h2>Đáp án và giải thích</h2><div data-i18n-ignore class="preline" th:text="${result.evidence}"></div></article>
</main></div></body></html>
