<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><body>
<section class="grid three stats" th:fragment="summary">
 <article class="card"><span>Chuỗi ngày học</span><strong th:text="${motivation.currentStreak + ' ngày'}"></strong></article>
 <article class="card"><span>XP</span><strong th:text="${motivation.totalXp}"></strong></article>
 <article class="card"><span>Mục tiêu ngày</span><strong th:text="${motivation.todayXp + '/' + motivation.targetXp + ' XP'}"></strong><progress max="100" th:value="${motivation.goalPercent}"></progress></article>
</section>
</body></html>
