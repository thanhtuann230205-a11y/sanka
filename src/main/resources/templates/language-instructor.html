<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Chấm ứng dụng theo cấp')}"></head><body><aside th:replace="~{fragments/layout :: sidebar}"></aside><div class="workspace"><header th:replace="~{fragments/layout :: topbar}"></header><main>
<h1>Bài ứng dụng kỹ thuật theo cấp.</h1><p class="success" th:if="${message}" th:text="${message}"></p><details th:replace="~{fragments/rubric :: rubric}"></details><article class="card" th:if="${#lists.isEmpty(work)}">Hiện không có bài chờ chấm.</article>
<article class="card" th:each="w : ${work}"><h2 th:text="${w.level.label + ' · ' + w.major.label}"></h2><small th:text="${'Học viên #' + w.studentId + ' · Bài #' + w.id}"></small><p class="spaced" th:text="${@languageCatalog.course(w.level).exercise}"></p><div class="preline submitted-work" th:text="${w.response}"></div><form th:action="@{/instructor/language-reviews/{id}(id=${w.id})}" method="post"><div class="grid two"><label>Ngôn ngữ (0–5)<input type="number" name="language" min="0" max="5" required></label><label>Chính xác kỹ thuật (0–5)<input type="number" name="technical" min="0" max="5" required></label><label>Giao tiếp (0–5)<input type="number" name="communication" min="0" max="5" required></label><label>Hoàn thành nhiệm vụ (0–5)<input type="number" name="task" min="0" max="5" required></label></div><label>Nhận xét và bước luyện tiếp<textarea name="feedback" minlength="10" maxlength="4000" rows="5" required></textarea></label><button class="button">Lưu điểm và phản hồi</button></form></article>
</main></div></body></html>
