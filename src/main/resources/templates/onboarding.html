<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Chọn chuyên ngành')}"></head><body><aside th:replace="~{fragments/layout :: sidebar}"></aside><div class="workspace"><header th:replace="~{fragments/layout :: topbar}"></header><main>
<h1>Chọn chuyên ngành</h1><p>Trình độ đã xác định: <b th:text="${student.level.label}"></b></p>
<form class="card onboarding" th:action="@{/onboarding}" method="post"><label>Chuyên ngành<select name="major" required><option value="">Chọn ngành học</option><option th:each="m : ${majors}" th:value="${m}" th:text="${m.label}" th:selected="${student.major == m}"></option></select></label><p class="muted">Đổi ngành không mất kết quả trình độ.</p><button class="button">Lưu và học chuyên ngành →</button></form></main></div></body></html>
