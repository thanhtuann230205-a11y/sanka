<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Ôn tập định kỳ')}"></head>
<body><aside th:replace="~{fragments/layout :: sidebar}"></aside><div class="workspace"><header th:replace="~{fragments/layout :: topbar}"></header><main>
<a th:href="@{/language/{level}(level=${level})}">← Quay lại khóa học</a><h1 class="spaced" th:text="${'Ôn tập định kỳ · ' + level.label}"></h1><p>5 phần: chữ viết, ngữ pháp, từ vựng, nghe và đọc. Kết quả giúp chọn nội dung cần ôn; không thay đổi trình độ.</p>
<form th:action="@{/language/{level}/review(level=${level})}" method="post"><fieldset class="card question" th:each="q, index : ${questions}"><legend th:text="${index.count + '. ' + q.prompt}"></legend><span class="pill" th:text="${q.skill}"></span><audio th:if="${q.audioId != null}" controls preload="none" th:src="@{/audio/{id}.wav(id=${q.audioId})}">Trình duyệt không hỗ trợ âm thanh.</audio><label class="choice" th:each="option, i : ${q.options}"><input type="radio" th:name="${'answer_' + q.id}" th:value="${i.index}" required><span th:text="${option}"></span></label></fieldset><button class="button">Nộp bài ôn →</button></form>
</main></div></body></html>
