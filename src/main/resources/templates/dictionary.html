<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Từ điển kỹ thuật')}"></head><body><aside th:replace="~{fragments/layout :: sidebar}"></aside><div class="workspace"><header th:replace="~{fragments/layout :: topbar}"></header><main><span class="eyebrow">TECHNICAL JAPANESE</span><h1>Từ điển kỹ thuật</h1><form action="/dictionary" method="get" class="card search"><label class="grow">Từ khóa<input name="q" th:value="${q}" placeholder="Kanji, cách đọc hoặc nghĩa tiếng Việt"></label><label>Chuyên ngành<select name="major"><option value="">Tất cả ngành</option><option th:each="m : ${majors}" th:value="${m}" th:text="${m.label}" th:selected="${selectedMajor == m}"></option></select></label><button class="button">Tìm kiếm</button></form><div class="grid two"><article class="card term" th:each="t : ${terms}"><span class="pill" th:text="${t.major.label}"></span><h2 data-i18n-ignore lang="ja" th:text="${t.japanese}"></h2><small data-i18n-ignore lang="ja" th:text="${t.reading}"></small><h3 data-i18n-ignore th:text="${t.vietnamese}"></h3><p data-i18n-ignore lang="ja" th:text="${t.example}"></p></article></div><section class="card" th:if="${#lists.isEmpty(terms)}"><h2>Chưa tìm thấy thuật ngữ</h2><p>Thử từ khóa ngắn hơn hoặc chọn tất cả ngành.</p></section></main></div></body></html>
