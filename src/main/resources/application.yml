spring:
  config:
    import: optional:file:./application-local.yml
  application:
    name: sanka-lms
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/sanka_lms?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh}
    username: ${DB_USERNAME:sanka}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  thymeleaf:
    cache: false
server:
  port: ${PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
  error:
    include-message: never
