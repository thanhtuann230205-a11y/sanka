<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><body>
<section class="card" th:fragment="lessons">
  <div class="lesson-list">
    <a class="lesson-row" th:each="l : ${lessons}" th:href="@{/lessons/{id}(id=${l.id})}">
      <span class="lesson-icon" th:text="${completed.contains(l.id) ? '✓' : '文'}"></span>
      <div><b data-i18n-ignore th:text="${#strings.replace(#strings.replace(l.title, 'S5 · ', ''), 'S4 · ', '')}"></b></div>
      <span class="row-end" th:text="${completed.contains(l.id) ? 'Hoàn thành' : 'Bắt đầu'}"></span>
    </a>
  </div>
  <div class="spaced" th:if="${nextLesson == null}">
    <p>Đã hoàn thành các bài học.</p>
    <a class="button" th:href="${courseNextUrl}" th:text="${courseNextLabel}"></a>
  </div>
</section>
</body></html>
