<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Tổng quan')}"></head><body>
<aside th:replace="~{fragments/layout :: sidebar}"></aside><div class="workspace">
<header th:replace="~{fragments/layout :: topbar}"></header><main>
<div class="page-heading"><div><h1>Chào <span data-i18n-ignore th:text="${student.name}"></span></h1></div><span class="pill" th:if="${student.major != null}" th:text="${student.major.label}"></span></div>
<section class="hero-card"><div><h2 th:text="${courseTitle}"></h2><p>Trình độ: <b th:text="${student.level.label}"></b></p>
<a class="button white" th:if="${nextLesson != null}" th:href="@{/lessons/{id}(id=${nextLesson.id})}">Tiếp tục học</a><a class="button white" th:if="${nextLesson == null}" th:href="${courseNextUrl}" th:text="${courseNextLabel}"></a></div><div class="progress-orb"><strong th:text="${percent + '%'}"></strong><span>Hoàn thành</span><progress max="100" th:value="${percent}"></progress></div></section>
<section class="card" th:unless="${foundation}"><h2>6 bước học chuyên ngành</h2><a class="button" href="/specialized">Tiếp tục học chuyên ngành</a></section>
<section th:replace="~{fragments/motivation :: summary}"></section>
<div class="section-heading"><h2>Bài học</h2><a href="/journey">Lộ trình học</a></div><section th:replace="~{fragments/course :: lessons}"></section>
<p class="muted" th:if="${foundation}">Đạt S4 để chọn chuyên ngành.</p>
</main></div></body></html>
