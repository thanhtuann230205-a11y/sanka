<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Flashcard')}"></head>
<body><aside th:replace="~{fragments/layout :: sidebar}"></aside><div class="workspace">
<header th:replace="~{fragments/layout :: topbar}"></header><main>
<link rel="stylesheet" th:href="@{/css/flashcards.css}">
<a class="back" href="/path">Lộ trình học</a>
<article class="card flashcard-player" id="flashcard-player" th:attr="data-lesson-id=${lesson.id},data-studied=${studied},data-done=${done}">
 <h1 data-i18n-ignore th:text="${#strings.replace(#strings.replace(lesson.title, 'S4 · ', ''), 'S5 · ', '')}"></h1>
 <div class="flashcard-progress"><span id="flashcard-count" aria-live="polite"></span><span id="flashcard-studied"></span></div>
 <progress id="flashcard-progress" th:max="${#lists.size(cards)}" value="1" aria-label="Vị trí thẻ đang xem"></progress>
 <section class="word-card" th:each="card,stat : ${cards}" th:hidden="${stat.index != 0}" th:attr="data-index=${stat.index}">
  <h2 data-i18n-ignore lang="ja" th:text="${card.word}"></h2>
  <div class="word-answer" hidden>
   <div class="word-detail" th:if="${!#strings.isEmpty(card.reading)}"><span class="word-label">Cách đọc</span><p data-i18n-ignore class="word-reading" lang="ja" th:text="${card.reading}"></p></div>
   <div class="word-detail"><span class="word-label">Nghĩa tiếng Việt</span><h3 data-i18n-ignore th:text="${card.meaning}"></h3></div>
   <div class="word-detail" th:if="${!#strings.isEmpty(card.example)}"><span class="word-label">Ví dụ</span><p data-i18n-ignore class="word-example" lang="ja" th:text="${card.example}"></p></div>
  </div>
 </section>
 <div class="flashcard-actions"><button class="button secondary" id="flashcard-previous" type="button">Thẻ trước</button><button class="button" id="flashcard-flip" type="button" aria-expanded="false">Xem nghĩa</button><button class="button" id="flashcard-next" type="button" disabled>Thẻ tiếp</button></div>
 <p id="flashcard-status" role="status" aria-live="polite"></p>
 <section id="flashcard-finished" hidden><h2>Đã hoàn thành bài học</h2><div class="flashcard-finish-actions"><a class="button" href="/dashboard">Học tiếp</a><button class="button secondary" type="button" id="flashcard-restart">Ôn lại</button></div></section>
 <form id="flashcard-token" th:action="@{/lessons/{id}/complete(id=${lesson.id})}" method="post" hidden></form>
 <noscript><p>Bật JavaScript để học flashcard.</p></noscript>
</article></main></div><script th:src="@{/js/flashcards.js}" defer></script></body></html>
