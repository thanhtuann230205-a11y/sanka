spring:
  config:
    import: optional:file:./application-local.yml
  application:
    name: sanka-lms
  session:
    timeout: ${SESSION_TIMEOUT:8h}
    jdbc:
      initialize-schema: never
      table-name: SANKA_SESSION
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/sanka_lms?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh}
    username: ${DB_USERNAME:sanka}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  thymeleaf:
    cache: false
server:
  port: ${PORT:8080}
  servlet:
    session:
      cookie:
        name: SANKA_SESSION
        http-only: true
        same-site: lax
  error:
    include-message: never
sanka:
  chat:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.1-flash-lite}
  email:
    api-key: ${MAILJET_API_KEY:}
    secret-key: ${MAILJET_SECRET_KEY:}
    sender: ${EMAIL_FROM:}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:{baseUrl}/login/oauth2/code/google}
