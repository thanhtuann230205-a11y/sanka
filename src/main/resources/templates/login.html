<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Đăng nhập')}"></head><body><main class="public-main"><a class="brand" href="/">三 SANKA</a><section class="auth card"><span class="eyebrow">CHÀO MỪNG TRỞ LẠI</span><h1>Tiếp tục hành trình.</h1><p>Đăng nhập để lưu tiến độ học của bạn.</p><p class="alert" th:if="${param.error}">Email hoặc mật khẩu không đúng.</p><p class="success" th:if="${param.registered}">Đăng ký thành công. Hãy đăng nhập.</p><form th:action="@{/login}" method="post"><label>Email<input name="username" type="email" autocomplete="username" required></label><label>Mật khẩu<input name="password" type="password" autocomplete="current-password" required></label><button class="button">Đăng nhập →</button></form><p>Chưa có tài khoản? <a href="/register">Đăng ký</a></p></section></main></body></html>
