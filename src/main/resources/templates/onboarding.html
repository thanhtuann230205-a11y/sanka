<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Chọn chuyên ngành')}"></head><body><aside th:replace="~{fragments/layout :: sidebar}"></aside><div class="workspace"><header th:replace="~{fragments/layout :: topbar}"></header><main>
<span class="eyebrow">ĐÃ ĐẠT ĐIỀU KIỆN S4</span><h1>Bạn muốn học chuyên ngành nào?</h1><p>Trình độ đã xác định: <b th:text="${student.level.label}"></b>. Chọn ngành để bắt đầu học tiếng Nhật chuyên ngành.</p>
<form class="card onboarding" th:action="@{/onboarding}" method="post"><label>Chuyên ngành<select name="major" required><option value="">Chọn ngành học</option><option th:each="m : ${majors}" th:value="${m}" th:text="${m.label}" th:selected="${student.major == m}"></option></select></label><p class="muted">Đổi ngành giữ nguyên kết quả trình độ; tiến độ chuyên ngành được xét riêng cho từng ngành.</p><button class="button">Lưu và học chuyên ngành →</button></form></main></div></body></html>
