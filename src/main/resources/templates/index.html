<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tiếng Nhật kỹ thuật · Sanka</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <link rel="stylesheet" th:href="@{/css/home-language.css}">
  <link rel="stylesheet" th:href="@{/css/home.css}">
  <script th:src="@{/js/ui-translations.js}" defer></script><script th:src="@{/js/home-language.js}" defer></script><script th:src="@{/js/chatbot.js}" defer></script>
</head>
<body class="home-page">
<div class="japan-background" aria-hidden="true">
  <img th:src="@{/images/japan-adventure-v1.jpg}" alt="" width="1536" height="1024" fetchpriority="high" decoding="async">
</div>
<main class="public-main">

  <header class="landing-nav">
    <a class="brand" href="/" aria-label="SANKA"><span class="home-brand-mark" aria-hidden="true">三</span><span class="home-brand-name">SANKA</span></a>
    <div class="landing-actions">
<div th:replace="~{fragments/language :: switcher}"></div>
      <a href="/login" data-i18n="login">Đăng nhập</a>
    </div>
  </header>
  <section class="landing-hero">
    <h1 data-i18n="title">Tiếng Nhật kỹ thuật</h1>
    <a class="button" href="/register" data-i18n="start">Bắt đầu học</a>
    <a class="button secondary" href="#journey" data-i18n="journey">Lộ trình</a>
  </section>
  <section class="adventure-frame" id="journey" aria-label="Bản đồ học tập">
   <div class="adventure-scroll" tabindex="0" aria-label="Bản đồ học tập, cuộn ngang để khám phá">
    <nav class="adventure-world" aria-label="Chọn điểm đến">
     <a class="adventure-stop adventure-placement" href="/exams/PLACEMENT"><span class="adventure-marker" aria-hidden="true">1</span><span class="adventure-label" data-i18n="placement">Kiểm tra đầu vào</span></a>
     <a class="adventure-stop adventure-major" href="/onboarding"><span class="adventure-marker" aria-hidden="true">2</span><span class="adventure-label" data-i18n="major">Chọn chuyên ngành</span></a>
     <a class="adventure-stop adventure-practice" href="/journey"><span class="adventure-marker" aria-hidden="true">3</span><span class="adventure-label" data-i18n="practice">Thực hành</span></a>
    </nav>
   </div>
  </section>
  <footer>SANKA</footer>
</main></body></html>
