<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng ký · Sanka</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <link rel="stylesheet" th:href="@{/css/home-language.css}">
  <link rel="stylesheet" th:href="@{/css/home.css}">
  <script th:src="@{/js/ui-translations.js}" defer></script><script th:src="@{/js/home-language.js}" defer></script><script th:src="@{/js/chatbot.js}" defer></script>
</head>
<body class="home-page auth-page">
<div class="japan-background" aria-hidden="true">
  <img th:src="@{/images/japan-adventure-v1.jpg}" alt="" width="1536" height="1024" fetchpriority="high" decoding="async">
</div>
<main class="public-main">
  <header class="landing-nav">
    <a class="brand" href="/" aria-label="SANKA"><span class="home-brand-mark" aria-hidden="true">三</span><span class="home-brand-name">SANKA</span></a>
    <div th:replace="~{fragments/language :: switcher}"></div>
  </header>
  <section class="auth card">
    <h1>Đăng ký</h1>
    <div th:replace="~{fragments/google-auth :: button}"></div>
    <form th:action="@{/register}" th:object="${registration}" method="post">
      <div class="alert" th:if="${#fields.hasAnyErrors()}"><p th:each="e : ${#fields.allErrors()}" th:text="${e}"></p></div>
      <label>Họ và tên<input th:field="*{name}" autocomplete="name" maxlength="80" required></label>
      <label>Email<input th:field="*{email}" type="email" autocomplete="email" maxlength="190" required></label>
      <label>Mật khẩu (8–72 ký tự)<input name="password" type="password" minlength="8" maxlength="72" autocomplete="new-password" required></label>
      <button class="button">Gửi mã xác nhận</button>
    </form>
    <p>Đã có tài khoản? <a href="/login">Đăng nhập</a></p>
  </section>
</main></body></html>
