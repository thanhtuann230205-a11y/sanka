<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Bảng xếp hạng')}"></head><body><aside th:replace="~{fragments/layout :: sidebar}"></aside><div class="workspace"><header th:replace="~{fragments/layout :: topbar}"></header><main>
<h1>Bảng xếp hạng</h1>
<p class="success" th:if="${message}" th:text="${message}"></p>
<section class="card" th:if="${student.role == 'STUDENT'}"><h2>Quyền tham gia của bạn</h2>
<form th:action="@{/leaderboard/preferences}" method="post"><label>Bí danh hiển thị<input name="nickname" minlength="2" maxlength="30" th:value="${profile.nickname}"></label><label class="choice"><input type="checkbox" name="enabled" value="true" th:checked="${profile.leaderboardEnabled}"><span>Tôi đồng ý hiển thị bí danh, ngành, trình độ và XP trong bảng xếp hạng.</span></label><button class="button">Lưu lựa chọn</button></form></section>
<form class="card ranking-filters" action="/leaderboard" method="get"><label>Khoảng thời gian<select name="period"><option value="week" th:selected="${period == 'week'}">Tuần này</option><option value="all" th:selected="${period == 'all'}">Toàn thời gian</option></select></label><label>Chuyên ngành<select name="major"><option value="">Tất cả ngành</option><option th:each="m : ${majors}" th:value="${m}" th:text="${m.label}" th:selected="${selectedMajor == m}"></option></select></label><label>Trình độ<select name="level"><option value="">Tất cả trình độ</option><option th:each="l : ${levels}" th:value="${l}" th:text="${l.label}" th:selected="${selectedLevel == l}"></option></select></label><button class="button">Xem nhóm</button></form>
<section class="card"><h2 th:text="${period == 'week' ? 'Từ ' + #temporals.format(weekStart, 'd/M') + ' đến ' + #temporals.format(weekEnd, 'd/M') : 'XP toàn thời gian'}"></h2><p th:if="${#lists.isEmpty(ranking)}">Chưa có người tham gia.</p><div class="table-scroll" th:unless="${#lists.isEmpty(ranking)}"><table><thead><tr><th>Hạng</th><th>Bí danh</th><th>Chuyên ngành</th><th>Trình độ</th><th>XP</th></tr></thead><tbody><tr th:each="row : ${ranking}" th:classappend="${row.own ? 'own-ranking' : ''}"><td th:text="${row.rank}"></td><td><b data-i18n-ignore th:text="${row.nickname}"></b><small th:if="${row.own}">Bạn</small></td><td th:text="${row.major == null ? 'Chưa chọn ngành' : row.major.label}"></td><td th:text="${row.level == null ? 'Chưa kiểm tra' : row.level.label}"></td><td th:text="${row.xp}"></td></tr></tbody></table></div></section><a href="/motivation">Xem mục tiêu, lịch học và huy hiệu của tôi </a>
</main></div></body></html>
