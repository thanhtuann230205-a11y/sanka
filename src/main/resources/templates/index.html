<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tiếng Nhật kỹ thuật · Sanka</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <link rel="stylesheet" th:href="@{/css/home-language.css}">
  <link rel="stylesheet" th:href="@{/css/home.css}">
  <script th:src="@{/js/ui-translations.js}" defer></script><script th:src="@{/js/home-language.js}" defer></script>
</head>
<body class="home-page">
<div class="japan-background" aria-hidden="true">
  <img th:src="@{/images/japan-hero-v2.jpg}" alt="" width="1536" height="1024" fetchpriority="high" decoding="async">
</div>
<main class="public-main">

  <header class="landing-nav">
    <a class="brand" href="/" aria-label="SANKA"><span class="home-brand-mark" aria-hidden="true">三</span><span class="home-brand-name">SANKA</span></a>
    <div class="landing-actions">
<div th:replace="~{fragments/language :: switcher}"></div>
      <a href="/login" data-i18n="login">Đăng nhập</a>
    </div>
  </header>
  <section class="landing-hero">
    <h1 data-i18n="title">Tiếng Nhật kỹ thuật</h1>
    <a class="button" href="/register" data-i18n="start">Bắt đầu học</a>
    <a class="button secondary" href="#journey" data-i18n="journey">Lộ trình</a>
  </section>
  <section class="grid three" id="journey">
    <article class="card"><div class="home-card-top"><span class="eyebrow">01</span><span class="home-step-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-3"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="m8 14 3 3 5-6"/></svg></span></div><h2 data-i18n="placement">Kiểm tra đầu vào</h2><p data-i18n="placementDescription">Xác định trình độ của bạn.</p></article>
    <article class="card"><div class="home-card-top"><span class="eyebrow">02</span><span class="home-step-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m2 9 10-5 10 5-10 5-10-5Z"/><path d="M6 11v6c4 3 8 3 12 0v-6M22 9v7"/></svg></span></div><h2 data-i18n="major">Chọn chuyên ngành</h2><p data-i18n="majorDescription">Mở khi đạt S4 trở lên.</p></article>
    <article class="card"><div class="home-card-top"><span class="eyebrow">03</span><span class="home-step-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11a8 8 0 0 1-8 8H8l-5 3 1-6a8 8 0 1 1 17-5Z"/><path d="M8 9h8M8 13h5"/></svg></span></div><h2 data-i18n="practice">Thực hành</h2><p data-i18n="practiceDescription">Tiếng Nhật trong công việc.</p></article>
  </section>
  <footer>SANKA</footer>
</main></body></html>
