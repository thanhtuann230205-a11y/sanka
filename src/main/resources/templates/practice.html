<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Thực hành công việc')}"></head>
<body><aside th:replace="~{fragments/layout :: sidebar}"></aside><div class="workspace">
<header th:replace="~{fragments/layout :: topbar}"></header><main>
  <a href="/specialized"> Học chuyên ngành</a>
  <h1 class="spaced" th:text="${kind.label}"></h1>
  <article data-i18n-ignore class="card preline" th:text="${prompt}"></article>
  <p class="success" th:if="${message}" th:text="${message}"></p>
  <p class="alert" th:if="${error}" th:text="${error}" role="alert"></p>
  <article class="card" th:if="${lastSubmission != null and lastSubmission.feedback != null}"><h2>Phản hồi lần nộp trước</h2><p data-i18n-ignore class="preline" th:text="${lastSubmission.feedback}"></p></article>
  <details class="card"><summary>Bố cục tham khảo</summary><pre id="writing-outline" class="preline" lang="ja" th:text="${outline}"></pre></details>
  <details class="card"><summary>Kiểm tra trước khi nộp</summary><ul><li th:each="item : ${checklist}" th:text="${item}"></li></ul></details>
  <details class="card" open th:replace="~{fragments/rubric :: rubric}"></details>
  <article class="card" th:if="${lastSubmission != null and lastSubmission.status == 'PENDING'}">
    <h2>Bài đang chờ giảng viên chấm</h2>
    <details><summary>Xem bài đã nộp</summary><div data-i18n-ignore class="preline" th:text="${lastSubmission.response}"></div></details><a href="/competency">Xem trạng thái và minh chứng </a>
  </article>
  <form class="card" th:unless="${lastSubmission != null and lastSubmission.status == 'PENDING'}" th:action="@{/practice/{kind}(kind=${kind})}" method="post">
    <p class="muted" th:if="${draft != null}" th:text="${'Bản nháp lưu lúc ' + #temporals.format(draft.updatedAt,'dd/MM/yyyy HH:mm')}"></p>
    <button type="button" class="button secondary" id="insert-outline">Dùng bố cục cho bài trống</button>
    <p id="outline-status" role="status"></p>
    <label for="response">Bài làm tiếng Nhật (80–10.000 ký tự)</label>
    <textarea data-i18n-ignore id="response" name="response" rows="16" minlength="80" maxlength="10000" required lang="ja" th:text="${responseText}" placeholder="件名：…"></textarea>
    <output id="character-count" for="response"></output>

    <button class="button secondary" th:formaction="@{/practice/{kind}/draft(kind=${kind})}" formnovalidate>Lưu bản nháp</button>
    <button class="button">Nộp cho giảng viên </button>
  </form>
</main></div><script th:src="@{/js/writing.js}" defer></script></body></html>
