<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Bài học')}"></head><body><aside th:replace="~{fragments/layout :: sidebar}"></aside><div class="workspace"><header th:replace="~{fragments/layout :: topbar}"></header><main><a class="back" href="/path">← Lộ trình của tôi</a><article class="card lesson-player"><span class="eyebrow" th:text="${lesson.level.label + ' / ' + lesson.minutes + ' PHÚT'}"></span><h1 th:text="${lesson.title}"></h1><span class="pill">HỌC LIỆU MẪU</span><div class="lesson-content" th:text="${lesson.content}"></div><form th:action="@{/lessons/{id}/complete(id=${lesson.id})}" method="post"><button class="button" th:disabled="${done}" th:text="${done ? '✓ Đã hoàn thành' : 'Đánh dấu hoàn thành · +20 XP'}"></button></form><p th:if="${lesson.major != null}"><a href="/specialized/TERMS">Từ vựng và thuật ngữ chuyên ngành →</a></p><p class="muted">Đọc nội dung và thực hành trước khi xác nhận hoàn thành.</p></article></main></div></body></html>
