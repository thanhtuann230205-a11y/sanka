<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Đăng ký')}"></head><body><main class="public-main"><a class="brand" href="/">三 SANKA</a><section class="auth card"><span class="eyebrow">BẮT ĐẦU CÙNG SANKA</span><h1>Một bước đến tương lai.</h1><form th:action="@{/register}" th:object="${registration}" method="post"><div class="alert" th:if="${#fields.hasAnyErrors()}"><p th:each="e : ${#fields.allErrors()}" th:text="${e}"></p></div><label>Họ và tên<input th:field="*{name}" autocomplete="name" maxlength="80" required></label><label>Email<input th:field="*{email}" type="email" autocomplete="email" maxlength="190" required></label><label>Mật khẩu (8–72 ký tự)<input name="password" type="password" minlength="8" maxlength="72" autocomplete="new-password" required></label><button class="button">Tạo tài khoản →</button></form><p>Đã có tài khoản? <a href="/login">Đăng nhập</a></p></section></main></body></html>
