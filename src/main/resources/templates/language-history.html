<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Lịch ôn và lịch sử')}"></head><body><aside th:replace="~{fragments/layout :: sidebar}"></aside><div class="workspace"><header th:replace="~{fragments/layout :: topbar}"></header><main>
<a href="/language">← Tiếng Nhật theo trình độ</a><h1 class="spaced">Lịch ôn và minh chứng học tập.</h1><p class="success" th:if="${message}" th:text="${message}"></p>
<article class="card"><h2>Lịch kiểm tra định kỳ</h2><div class="lesson-row" th:each="c : ${courses}" th:if="${c.enrollment != null}"><b th:text="${c.level.label}"></b><span th:text="${(c.due ? 'Đến hạn: ' : 'Tiếp theo: ') + #temporals.format(c.enrollment.nextReviewAt,'dd/MM/yyyy')}"></span><a class="row-end" th:href="@{/language/{level}/review(level=${c.level})}">Ôn tập →</a></div><p>Chưa có lịch? Mở khóa học và chọn bật lịch ôn.</p></article>
<article class="card"><h2>Lịch sử kiểm tra</h2><p th:if="${#lists.isEmpty(reviews)}">Chưa có bài ôn định kỳ.</p><div class="lesson-row" th:each="r : ${reviews}"><b th:text="${r.level.label}"></b><span th:text="${#temporals.format(r.createdAt,'dd/MM/yyyy HH:mm')}"></span><a class="row-end" th:href="@{/language/results/{id}(id=${r.id})}" th:text="${r.score + '/100 · Xem minh chứng'}"></a></div></article>
<h2>Bài ứng dụng kỹ thuật theo cấp</h2><article class="card" th:if="${#lists.isEmpty(work)}">Chưa có bài ứng dụng được nộp.</article><article class="card" th:each="w : ${work}"><span class="pill" th:text="${w.status == 'PENDING' ? 'Đang chờ chấm' : (w.status == 'PASSED' ? 'Đạt' : 'Cần sửa và nộp lại')}"></span><h3 class="spaced" th:text="${w.level.label + ' · ' + w.major.label}"></h3><details><summary>Xem bài làm</summary><div class="preline" th:text="${w.response}"></div></details><section th:if="${w.reviewedAt != null}"><p class="spaced" th:text="${'Ngôn ngữ ' + w.languageScore + '/5 · Kỹ thuật ' + w.technicalScore + '/5 · Giao tiếp ' + w.communicationScore + '/5 · Nhiệm vụ ' + w.taskScore + '/5'}"></p><p class="preline" th:text="${w.feedback}"></p></section><a th:if="${w.status == 'REVISION' and w.major == student.major}" th:href="@{/language/{level}(level=${w.level})} + '#application'">Sửa và nộp lại →</a></article>
</main></div></body></html>
